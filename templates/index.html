<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brexna AI | The Multi-Personaity AI Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon" sizes="1638x1638" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h1>Brexna AI</h1>
            <div class="personality-selector">
                <label for="personality-select">Select A Personality:</label>
                <select id="personality-select">
                    {# Loop through personalities passed from Flask #}
                    {% for key, personality_data in personalities.items() %}
                    <option value="{{ key }}" {% if key == 'brexna' %}selected{% endif %}>{{ personality_data.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </header>
        <div id="chat-box" class="chat-box">
            <div id="initial-greeting" class="initial-greeting-message">
                <p>Hello!</p>
                <p class="sub-greeting">How can I help you today?</p>
            </div>
        </div>
        
        <div class="input-container">
            <div id="typing-indicator" class="typing-indicator">
                <span></span><span></span><span></span>
            </div>
            <textarea id="user-input" placeholder="Type your message..." rows="1"></textarea>
            <button id="send-button" title="Send message">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div> 
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script> </body>
</body>
</html>
